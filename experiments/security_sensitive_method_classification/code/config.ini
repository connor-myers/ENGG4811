[DEFAULT]
block_size = 512
learning_rate = 2e-5
max_grad_norm = 1.0

[codebert]
tokeniser = microsoft/codebert-base
model = microsoft/codebert-base

[unixcoder]
tokeniser = microsoft/unixcoder-base
model = microsoft/unixcoder-base

[train]
train_data_file = "../dataset/train.jsonl"
eval_data_file = "../dataset/eval.jsonl"

num_epochs = 3
batch_size = 4

[test]
test_data_file = "../dataset/train.jsonl"

batch_size = 8

[eval]
eval_data_file = "../dataset/eval.jsonl"

batch_size = 8
